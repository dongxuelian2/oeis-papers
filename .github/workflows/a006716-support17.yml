name: A006716 support-17 exact integer search

on:
  push:
    branches:
      - research/a087354-exact-minimum-20261022
    paths:
      - papers/A006716/verify_sparse_roots_17.cpp
      - .github/workflows/a006716-support17.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support17:
    name: Exact r17, root units ${{ matrix.unit }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        unit: [1, 2, 3, 7, 8, 9]
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost multiprecision headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libboost-dev
      - name: Compile exact root support-17 verifier
        run: g++ -std=c++17 -O3 papers/A006716/verify_sparse_roots_17.cpp -o /tmp/a006716_sparse17
      - name: Exhaust complete root class using global triple-digit restriction
        run: /tmp/a006716_sparse17 ${{ matrix.unit }}
