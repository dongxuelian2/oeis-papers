name: Compile and commit Lucas coefficient manuscript PDF
on:
  push:
    branches: [research/lucas-coefficient-families-20261027]
    paths:
      - 'papers/Lucas-coefficient-families/main.tex'
      - '.github/workflows/lucas-coefficients-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: papers/Lucas-coefficient-families
          root_file: main.tex
      - name: Verify mathematical claims
        run: python3 papers/Lucas-coefficient-families/verify.py
      - name: Commit generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f papers/Lucas-coefficient-families/main.pdf
          git diff --cached --quiet || git commit -m 'Build Lucas coefficient-family research PDF'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"