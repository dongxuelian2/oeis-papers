name: Sync certified global Lucas uniqueness PDF
on:
  push:
    branches: [research/a191981-unique-representations-20261026]
    paths:
      - 'papers/Lucas-coefficient-families/main.tex'
      - '.github/workflows/lucas-coefficients-pdf-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: papers/Lucas-coefficient-families
          root_file: main.tex
      - name: Verify all global coefficient certificates
        run: |
          python3 papers/Lucas-coefficient-families/verify.py
          python3 papers/Lucas-coefficient-families/verify_all_integer.py
          python3 papers/Lucas-coefficient-families/verify_ratio_collisions.py
          python3 papers/Lucas-coefficient-families/verify_global_collisions.py
          python3 papers/Lucas-coefficient-families/verify_stationary_collisions.py
          python3 papers/Lucas-coefficient-families/verify_all_global_unique.py
      - name: Commit complete PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f papers/Lucas-coefficient-families/main.pdf
          git diff --cached --quiet || git commit -m 'Build all-integer global uniqueness PDF'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
