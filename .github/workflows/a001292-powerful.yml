name: A001292 powerful-value sieve

on:
  pull_request:
    paths:
      - 'papers/A001292/**'
      - '.github/workflows/a001292-powerful.yml'
  push:
    paths:
      - 'papers/A001292/**'
      - '.github/workflows/a001292-powerful.yml'
  workflow_dispatch:

jobs:
  arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GMP runtime
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Verify the residue and boundary theorems
        run: |
          python papers/A001292/verify_a001292.py
          python papers/A001292/verify_structure.py
      - name: Verify the powerful-value sieve
        run: python papers/A001292/verify_powerful_sieve.py
      - name: Check all possible exponents through m equals 1000
        run: python papers/A001292/search_gmp.py 1000
