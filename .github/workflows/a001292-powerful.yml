name: A001292 powerful-value sieve

on:
  pull_request:
    paths:
      - 'papers/A001292/**'
      - '.github/workflows/a001292-powerful.yml'
  push:
    paths:
      - 'papers/A001292/**'
      - '.github/workflows/a001292-powerful.yml'
  workflow_dispatch:

jobs:
  arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GMP runtime
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Verify the residue and boundary theorems
        run: |
          python papers/A001292/verify_a001292.py
          python papers/A001292/verify_structure.py
      - name: Verify the powerful-value sieve
        run: python papers/A001292/verify_powerful_sieve.py
      - name: Verify the complete-boundary valuation formulas
        run: python papers/A001292/verify_boundary_valuations.py
      - name: Verify the additional boundary primes and density bound
        run: python papers/A001292/verify_local_primes.py
      - name: Verify boundary power characters and strengthened density
        run: python papers/A001292/verify_boundary_characters.py
      - name: Verify general boundary-prime lifting and local power criteria
        run: python papers/A001292/verify_general_boundary_primes.py
      - name: Check all possible exponents through m equals 1000
        run: python papers/A001292/search_gmp.py 1000

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the committed manuscript PDF
        run: git ls-files --error-unmatch papers/A001292/main.pdf
      - name: Compile the current manuscript
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: papers/A001292
          root_file: main.tex
