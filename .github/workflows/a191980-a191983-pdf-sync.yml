name: Sync PDF for four Lucas sequences
on:
  push:
    branches: [research/a191981-unique-representations-20261026]
    paths:
      - 'papers/A191980-A191983/main.tex'
      - '.github/workflows/a191980-a191983-pdf-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: papers/A191980-A191983
          root_file: main.tex
      - name: Check complete intersection certificate
        run: |
          python3 papers/A191980-A191983/verify_sum_difference_overlap.py
          python3 papers/A191980-A191983/verify_sums.py
      - name: Commit rebuilt PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f papers/A191980-A191983/main.pdf
          git diff --cached --quiet || git commit -m 'Update Lucas manuscript PDF with complete intersection'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
